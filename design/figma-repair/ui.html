<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{font:14px/1.5 Inter,Arial,sans-serif;margin:24px;color:#263b52}h2{font-size:20px;margin:0 0 12px}p{margin:8px 0}button{font:inherit;background:#2e70b2;color:white;border:0;border-radius:12px;padding:12px 18px;margin-top:14px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow:auto;max-height:110px;font:12px/1.5 monospace}</style><h2>Восстановить SkillSprint</h2><p>Заполнить 5 экранов и добавить форму цели. Сохранить редактируемые тексты, Heroicons, компоненты и переходы.</p><p>Старый импорт переместится в архив на страницу компонентов. Пользовательские элементы остаются на месте.</p><button id="run">Восстановить экраны</button><p id="status"></p><script>const button=document.getElementById('run'),status=document.getElementById('status');button.onclick=()=>{button.disabled=true;status.textContent='Сборка экранов…';parent.postMessage({pluginMessage:{type:'repair'}},'*')};onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;if(m.type==='done'){status.textContent='Созданы 6 экранов. Проверь макет на холсте. Шрифт: '+m.report.fontsUsed.join(', ');button.textContent='Закрыть';button.disabled=false;button.onclick=()=>parent.postMessage({pluginMessage:{type:'close'}},'*')}else if(m.type==='error'){status.textContent='Остановлено: '+m.message;button.textContent='Закрыть';button.disabled=false;button.onclick=()=>parent.postMessage({pluginMessage:{type:'close'}},'*')}};</script></html>
